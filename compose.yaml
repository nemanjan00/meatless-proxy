# `docker compose up` is the install. Configuration goes in .env (see .env.example).
name: meatless-proxy

services:
  app:
    # The published image; if it can't be pulled (or with `--build`), it's built from this checkout.
    image: ghcr.io/nemanjan00/meatless-proxy:latest
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres@postgres:5432/meatless_proxy
      # node-postgres reads the password from PGPASSWORD, so it isn't part of the URL.
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379
      DOCKER_ENABLED: "true"
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_GID: ${DOCKER_GID:-}
      DATA_DIR: /data
      # Employee files: a named volume the app writes and code sandboxes mount (only their own part of it).
      FILES_DIR: /var/lib/meatless-proxy/files
      FILES_VOLUME: mp-files
      HOST: 0.0.0.0
      PORT: "3000"
      # Live previews are served on their own origin: this port, or PREVIEW_DOMAIN (see packages/server/README.md).
      PREVIEW_PORT: "3001"
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${PREVIEW_HOST_PORT:-3001}:3001"
    volumes:
      - data:/data
      - mp-files:/var/lib/meatless-proxy/files
      # Full Docker socket access (an accepted risk, see docs/execution.md#deployment):
      # project environments run as sibling containers on this host.
      - /var/run/docker.sock:/var/run/docker.sock
    # The app runs as a non-root user. Its entrypoint gives that user the socket's group by itself;
    # set DOCKER_GID only to add another group.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 45s

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: meatless_proxy
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meatless_proxy"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  data:
  # Named explicitly: sandbox containers mount it by this name, with a subpath per employee.
  mp-files:
    name: mp-files
  pgdata:
  redisdata:
